name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check

  go:
    name: Go foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          formatted="$(gofmt -l cmd internal sdk plugins)"
          if [ -n "$formatted" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$formatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./cmd/... ./internal/... ./sdk/... ./plugins/...

      - name: Test
        run: go test ./cmd/... ./internal/... ./sdk/... ./plugins/...

  frontend:
    name: Frontend foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  macos-foundation:
    name: macOS foundation smoke
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules on macOS
        run: go mod download

      - name: Test Go on target platform
        run: go test ./cmd/... ./internal/... ./sdk/... ./plugins/...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies on macOS
        working-directory: frontend
        run: npm ci

      - name: Build frontend on macOS
        working-directory: frontend
        run: npm run build
