name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

  go:
    name: Go foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          formatted="$(gofmt -l cmd internal sdk plugins)"
          if [ -n "$formatted" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$formatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./cmd/... ./internal/... ./sdk/... ./plugins/...

      - name: Test
        run: go test ./cmd/... ./internal/... ./sdk/... ./plugins/...

      - name: Test with race detector
        run: go test -race -count=1 ./cmd/... ./internal/... ./sdk/... ./plugins/...

  lint:
    name: Go lint and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: v2.13.2

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  frontend:
    name: Frontend foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Lint stylesheets
        working-directory: frontend
        run: npm run lint:css

      # Reads internal/desktop/*.go directly, so it needs the full checkout but
      # no Go toolchain. tsc cannot see this boundary: the renderer resolves
      # Bridge methods by name string at runtime and swallows a miss.
      - name: Check Go/TypeScript bridge contract
        working-directory: frontend
        run: npm run lint:contract

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  windows-foundation:
    name: Windows x64 OSS artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Refresh checkout with repository line endings
        shell: powershell
        run: git -c core.autocrlf=false checkout-index --force --all

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build on Windows
        shell: powershell
        run: |
          & ".\scripts\windows-runner\Invoke-YuriWindowsPipeline.ps1" `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -ArtifactDirectory (Join-Path $env:RUNNER_TEMP "yuri-windows-artifact") `
            -ToolsDirectory (Join-Path $env:RUNNER_TOOL_CACHE "yuri-wails") `
            -LaunchSmokeFlows @()

      - name: Upload Windows executable, checksum, and build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yuri-windows-x64-oss-${{ github.sha }}
          path: ${{ runner.temp }}\yuri-windows-artifact\*
          if-no-files-found: error
          retention-days: 7

  macos-foundation:
    name: macOS universal OSS artifact
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules on macOS
        run: go mod download

      - name: Test Go on target platform
        run: go test ./cmd/... ./internal/... ./sdk/... ./plugins/...

      - name: Run offline MVP lifecycle smoke with race detector
        run: make mvp-smoke

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install frontend dependencies on macOS
        working-directory: frontend
        run: npm ci

      - name: Build frontend on macOS
        working-directory: frontend
        run: npm run build

      - name: Build, validate, launch, and interact with universal OSS app
        run: make macos-smoke macos-launch-smoke macos-ui-smoke macos-voice-smoke YURI_VERSION=0.7.0 MACOS_LAUNCH_TIMEOUT=25

      - name: Upload universal OSS archive and checksum as CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yuri-macos-universal-oss-${{ github.sha }}
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
          if-no-files-found: error
          retention-days: 7
